# Dev overlay: bind-mount source + auto-reload so code changes
# don't require rebuilding the image.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    volumes:
      - ./backend:/app
      - resumes_data:/app/resumes
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
        "--reload",
        "--reload-dir",
        "/app",
      ]
    environment:
      - RESUME_DIR=/app/resumes

  worker:
    volumes:
      - ./backend:/app
      - resumes_data:/app/resumes
    environment:
      - RESUME_DIR=/app/resumes
    # Worker code edits are picked up via the bind-mount; restart the
    # worker (make restart-worker) to load them. Celery here has no
    # --autoreload (needs watchdog), so we keep the stable base command.
    # Debug launch: celery worker under debugpy (listen on 5678).
    # The `--` passes the Celery args to the worker; use -n to avoid
    # clashing with the default worker hostname if the base worker is
    # also running.
    command: [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        # "--wait-for-client",
        "-m",
        "celery",
        "-A",
        "app.core.celery_app.celery",
        "worker",
        "--loglevel=info",
        "--concurrency=1",
        "--pool=solo",
        "-n",
        "debug@%h",
      ]
    ports:
      - "5678:5678"
